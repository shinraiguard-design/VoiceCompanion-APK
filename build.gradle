plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.companionai.voiceapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.companionai.voiceapp"
        // minSdk 31 karena pakai SpeechRecognizer.createOnDeviceSpeechRecognizer()
        // yang baru stabil mulai Android 12 (API 31). Target HP-mu Android 13 = aman.
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "0.1.0-mvp"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false // aktifkan nanti setelah MVP stabil; minify sering bikin build dari HP jadi rumit
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Room = memory lokal (conversation history, persona). Tidak ada yang keluar device.
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Local LLM on-device: Google AI Edge / MediaPipe GenAI.
    // AAR ini sudah berisi native .so yang di-precompile Google,
    // jadi build dari HP TIDAK butuh NDK/CMake sama sekali.
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'

    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
